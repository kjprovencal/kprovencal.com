name: Host maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed command
        required: true
        type: choice
        options:
          - status
          - configure
          - apply
        default: status
      reboot:
        description: Reboot after apply when a kernel update needs it
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: host-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Run one allowlisted command
    if: github.ref == 'refs/heads/main'
    environment: production-host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/hostmaint/go.mod
          cache: false

      - name: Build host maintenance binary
        working-directory: deploy/hostmaint
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o personal-site-host-maint .

      - name: Check deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "SSH_HOST, SSH_USER, and SSH_PRIVATE_KEY must be set. These are the same secrets the deploy job already uses." >&2
            exit 1
          fi

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Known hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run maintenance
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          MODE: ${{ inputs.mode }}
          REBOOT: ${{ inputs.reboot }}
        run: |
          set -euo pipefail
          case "$MODE" in
            status|configure|apply) ;;
            *) echo "invalid mode" >&2; exit 1 ;;
          esac
          args="$MODE"
          if [ "$MODE" = "apply" ] && [ "$REBOOT" = "true" ]; then
            args="apply --reboot"
          fi
          if ! [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "SSH_USER has unsupported characters" >&2
            exit 1
          fi
          target="${SSH_USER}@${SSH_HOST}"
          scp -o BatchMode=yes deploy/hostmaint/personal-site-host-maint "${target}:/tmp/personal-site-host-maint.new"
          ssh -o BatchMode=yes "$target" "sudo -n install -m 0755 -o root -g root /tmp/personal-site-host-maint.new /usr/local/sbin/personal-site-host-maint && sudo -n rm -f /tmp/personal-site-host-maint.new"
          set +e
          ssh -o BatchMode=yes "$target" "if [ \"\$(id -u)\" -eq 0 ]; then exec /usr/local/sbin/personal-site-host-maint ${args}; fi; exec sudo -n /usr/local/sbin/personal-site-host-maint ${args}"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "The maintenance command failed." >&2
            if [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] && [ "$SSH_USER" != "root" ]; then
              echo "If sudo asked for a password, install this once as root and run configure again:" >&2
              echo "${SSH_USER} ALL=(root) NOPASSWD: /usr/local/sbin/personal-site-host-maint status, /usr/local/sbin/personal-site-host-maint configure, /usr/local/sbin/personal-site-host-maint apply, /usr/local/sbin/personal-site-host-maint apply --reboot" >&2
            fi
            exit "$code"
          fi
