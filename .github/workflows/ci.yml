name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (TypeScript / Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Public Turnstile site key — set repo secret VITE_TURNSTILE_SITE_KEY (optional; omit for builds without widget).
      - name: Build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage summary (job summary)
        run: |
          echo "### Frontend coverage (Vitest)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.total | "Total: **\(.statements.pct)%** statements · **\(.branches.pct)%** branches · **\(.functions.pct)%** functions · **\(.lines.pct)%** lines"' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Upload dist for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/

  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Test with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage summary (job summary)
        run: |
          echo "### API coverage (Go)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: api/coverage.out
          flags: api
          fail_ci_if_error: false

      - name: Build release binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${SOURCE_SHA}" -o personal-site-api .

      - name: Upload API binary for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-api
          path: api/personal-site-api

  host-maint:
    name: Host maintenance and nginx examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/hostmaint/go.mod
          cache: false

      - name: Go tests
        run: |
          set -euo pipefail
          (cd deploy/hostmaint && go test ./...)
          (cd deploy/opsalerts && go test ./...)

      - name: nginx example config
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx
          bash deploy/lint-nginx-example.sh

      - name: API environment file script
        run: bash deploy/write-api-env_test.sh

  deploy:
    name: Deploy to droplet
    needs: [frontend, api, host-maint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Download API binary
        uses: actions/download-artifact@v4
        with:
          name: site-api
          path: api-bin

      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Check out env writer
        uses: actions/checkout@v4

      # This step must not use set -x. xtrace would print the secret values.
      # GitHub secret masking is only a backstop. Required secrets are checked
      # before SSH, so a missing SESSION_SECRET does not replace the file or binary.
      - name: Write API environment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_PASSWORD_BCRYPT: ${{ secrets.ADMIN_PASSWORD_BCRYPT }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          LOG_PATH: ${{ secrets.LOG_PATH }}
          HOST_STATUS_PATH: ${{ secrets.HOST_STATUS_PATH }}
          ADMIN_SESSION_HOURS: ${{ secrets.ADMIN_SESSION_HOURS }}
          RATE_LIMIT_GET_MAX: ${{ secrets.RATE_LIMIT_GET_MAX }}
          RATE_LIMIT_POST_MAX: ${{ secrets.RATE_LIMIT_POST_MAX }}
          RATE_LIMIT_DISABLED: ${{ secrets.RATE_LIMIT_DISABLED }}
          SPACES_KEY: ${{ secrets.SPACES_KEY }}
          SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          SPACES_REGION: ${{ secrets.SPACES_REGION }}
          SPACES_ENDPOINT: ${{ secrets.SPACES_ENDPOINT }}
        run: |
          set -euo pipefail
          dest=$(mktemp)
          chmod 600 "$dest"
          trap 'rm -f "$dest"' EXIT
          bash deploy/write-api-env.sh "$dest"
          target="${SSH_USER}@${SSH_HOST}"
          ssh "$target" 'umask 077; cat > /tmp/personal-site-api.env.new && sudo install -m 600 -o root -g root /tmp/personal-site-api.env.new /etc/personal-site-api.env; status=$?; rm -f /tmp/personal-site-api.env.new; exit $status' < "$dest"

      - name: Rsync static site and install API binary
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euxo pipefail
          TARGET="${SSH_USER}@${SSH_HOST}"
          # dist/ owned by SSH_USER; chgrp to www-data so nginx can read via group (see deploy/SETUP.txt).
          rsync -avz --delete dist/ "${TARGET}:${DEPLOY_PATH}/dist/"
          scp api-bin/personal-site-api "${TARGET}:/tmp/personal-site-api.new"
          ssh "$TARGET" "sudo install -m 755 -o www-data -g www-data /tmp/personal-site-api.new '${DEPLOY_PATH}/personal-site-api' && sudo rm -f /tmp/personal-site-api.new && sudo chgrp -R www-data '${DEPLOY_PATH}/dist' && sudo systemctl restart personal-site-api"
